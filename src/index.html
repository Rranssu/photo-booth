<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Photo Booth</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load face-api.js for Lovestruck effect -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
</head>
<body class="mode-photo">
    <div class="app-container">
        
        <div class="video-container" id="video-wrapper">
            <div id="camera-view" class="view-panel">
                <video id="video" autoplay playsinline></video>
                <!-- This canvas draws the hearts -->
                <canvas id="overlay"></canvas>
                <div id="countdown" class="hidden">3</div>
                
                <div id="recording-indicator" class="hidden">
                    <div class="rec-dot"></div>
                    <span id="video-timer">00:00</span>
                </div>
            </div>

            <div id="grid-view" class="view-panel hidden">
                <div class="grid-layout" id="photo-grid"></div>
            </div>

            <div id="review-view" class="view-panel hidden">
                <img id="large-photo-display" src="" />
            </div>

            <div id="flash"></div>
        </div>

        <div id="filmstrip-container" class="hidden">
            <div id="filmstrip-track"></div>
        </div>

        <div id="effects-drawer" class="drawer-hidden">
            <div class="effect-item active" data-effect="normal">
                <div class="thumb-preview"></div>
                <span>Normal</span>
            </div>
            <div class="effect-item" data-effect="mirrored">
                <div class="thumb-preview" style="transform: scaleX(-1);"></div>
                <span>Mirror</span>
            </div>
            <div class="effect-item" data-effect="bw">
                <div class="thumb-preview" style="filter: grayscale(1);"></div>
                <span>B/W</span>
            </div>
            <div class="effect-item" data-effect="lovestruck">
                <div class="thumb-preview" style="background: linear-gradient(45deg, #ff758c, #ff7eb3);"></div>
                <span>Lovestruck</span>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-section left">
                <div class="mode-selector">
                    <button class="icon-btn" id="btn-mode-grid"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></button>
                    <button class="icon-btn active" id="btn-mode-photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></button>
                    <button class="icon-btn" id="btn-mode-video"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg></button>
                </div>
            </div>
            
            <div class="toolbar-section center">
                <button id="capture-btn">
                    <!-- FILLED CAMERA ICON -->
                    <svg class="shutter-icon-svg camera-img" width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="3.5" fill="var(--accent-red)"></circle>
                    </svg>
                    <!-- FILLED VIDEO ICON -->
                    <svg class="shutter-icon-svg video-img" width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M23 7l-7 5 7 5V7z"></path>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </button>
            </div>

            <div class="toolbar-section right">
                <button id="effects-toggle" class="pill-btn">Effects</button>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
